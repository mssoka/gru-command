# BEGIN GRU COMMAND BMAD BOOTSTRAP
[[setup]]
# Fresh clones have no git-local BMAD source. Only onboarded repositories
# run the generated copier; a configured but invalid source still fails loud.
command = "if git config --local --get gru-command.bmad-source >/dev/null 2>&1; then node .gru-command/bmad-bootstrap.mjs; fi"
# END GRU COMMAND BMAD BOOTSTRAP

# The scheduler runs inside each fresh job lane, never in the source checkout.
[[setup]]
command = "npm ci"

[verify]
full = "npm test"
typecheck = "npm run typecheck"

# Declared focused verification scopes (phase 4; invoked only via the
# authenticated /api/verify scheduler at unchanged budgets/thresholds —
# plain vitest invocations, no worker/timeout flags, never the npm chain).
residency-runtime = "npx vitest run test/resident-budget.test.ts test/runtime-resident-registry.test.ts test/fix-directive.test.ts test/silas-deterministic-seam.test.ts"
handoff-wave = "npx vitest run test/perkins-builtin-wave.test.ts test/perkins-whole-review.test.ts test/config.test.ts"
compaction-rollback = "npx vitest run test/pi-adapter.test.ts test/supervisor.test.ts test/config.test.ts test/health.test.ts test/board-engine.test.ts test/suite-shape.test.ts"
native-compaction-wait = "node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/supervisor.test.ts test/suite-shape.test.ts"

# Baseline comparison for the lane: identical final test files (git show
# from the pinned head) run against an isolated baseline snapshot (git
# archive of the pinned base) using the unchanged baseline Vitest
# config/budgets and the existing node_modules bound by symlink — no
# worktree/branch mutation, no dependency install, both sides keep the
# approved RPC-patch prerequisite. Expected result is RED: the new-policy
# oracles encode wait-not-restart behavior the baseline lacks. The vitest
# exit status is left intact so the scheduler captures outcome.exitCode
# as evidence; it is never masked into a PASS. This scope never deletes
# snapshot material; the ignored pointer file
# _bmad-output/gate-prep/native-compaction-wait-baseline.last-snapshot.txt
# records the latest snapshot location, preserved for inspection.
native-compaction-wait-baseline = 'set -e; base=2aa836abe262759c651683deb40d05f02c9ede86; headrev=ab11bb327c4ba1ab3e3e3a9cc9e6b3bcaf4a22b3; root="$PWD"; prep=_bmad-output/gate-prep; mkdir -p "$prep"; d=$(mktemp -d "${TMPDIR:-/tmp}/gru-baseline-native-compaction-wait.XXXXXX"); git archive "$base" | tar -x -C "$d"; git show "$headrev":test/supervisor.test.ts > "$d/test/supervisor.test.ts"; git show "$headrev":test/suite-shape.test.ts > "$d/test/suite-shape.test.ts"; ln -s "$root/node_modules" "$d/node_modules"; printf "%s base=%s head=%s\n" "$d" "$base" "$headrev" > "$prep/native-compaction-wait-baseline.last-snapshot.txt"; cd "$d"; node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/supervisor.test.ts test/suite-shape.test.ts'
# wizard-bmad-retry builds first so its CLI/pty legs execute the reviewed
# source's dist, then applies the repo-approved vitest RPC pretest patch
# (tools/patch-vitest-rpc-timeout.mjs) that `npm test` also runs.
wizard-bmad-retry = "npm run build && node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/bmad-onboarding.test.ts test/wizard-interactive.test.ts test/wizard.test.ts test/suite-shape.test.ts"

# Feature-specific BASELINE for the gh-32 lane (scheduler-only; never part
# of `npm test`): identical FINAL tests and suite pins (git show from the
# pinned final-test commit, captured at admission — never uncommitted
# bytes, never a circular hardcoded self-SHA) run against an isolated
# RETAINED snapshot (git archive) of the PRE-REPAIR merge parent
# cee0ecbe53229d05c13f909dd11d4b31e886db72 (2bf6bc7 + main 6a00f4e) — NOT
# the unrelated native-compaction baseline. So each split r1 class case
# (missing module, symlinked module, deleted recorded binding,
# control-file read+recovery, disposable preflight) REDs independently and
# attributably against pre-fix source. No worktree/branch mutation, no
# snapshot deletion, no dependency install (existing node_modules bound by
# symlink), no cherry-pick or other-lane patch. Baseline dist is BUILT
# before the dist-driven CLI/pty legs, after the approved RPC-patch
# prerequisite; no vitest flags — original pools/30s budgets/assertions
# and the 14-worker scheduler contract are inherited unchanged. vitest has
# no bail/short-circuit, so every independent case executes; the expected
# RED is the feature's nonzero exit, left intact (never masked into PASS).
# Baseline and final focused runs are separate scheduler requests. The
# ignored pointer file
# _bmad-output/gate-prep/wizard-bmad-retry-baseline.last-snapshot.txt
# records base SHA, final-test SHA, per-file test hashes and the latest
# retained snapshot location (older snapshots are kept for inspection).
wizard-bmad-retry-baseline = 'set -e; base=cee0ecbe53229d05c13f909dd11d4b31e886db72; headrev=5f61593a87c5fab3fc2e03f2769af03b21e95788; root="$PWD"; prep=_bmad-output/gate-prep; mkdir -p "$prep"; d=$(mktemp -d "${TMPDIR:-/tmp}/gru-baseline-wizard-bmad-retry.XXXXXX"); git archive "$base" | tar -x -C "$d"; for f in test/bmad-onboarding.test.ts test/wizard-interactive.test.ts test/wizard.test.ts test/suite-shape.test.ts; do git show "$headrev:$f" > "$d/$f"; done; { printf "base=%s head=%s snapshot=%s\n" "$base" "$headrev" "$d"; (cd "$d" && shasum -a 256 test/bmad-onboarding.test.ts test/wizard-interactive.test.ts test/wizard.test.ts test/suite-shape.test.ts); } > "$prep/wizard-bmad-retry-baseline.last-snapshot.txt"; ln -s "$root/node_modules" "$d/node_modules"; cd "$d"; node tools/patch-vitest-rpc-timeout.mjs && npm run build && npx vitest run test/bmad-onboarding.test.ts test/wizard-interactive.test.ts test/wizard.test.ts test/suite-shape.test.ts'
