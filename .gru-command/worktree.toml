# BEGIN GRU COMMAND BMAD BOOTSTRAP
[[setup]]
# Fresh clones have no git-local BMAD source. Only onboarded repositories
# run the generated copier; a configured but invalid source still fails loud.
command = "if git config --local --get gru-command.bmad-source >/dev/null 2>&1; then node .gru-command/bmad-bootstrap.mjs; fi"
# END GRU COMMAND BMAD BOOTSTRAP

# The scheduler runs inside each fresh job lane, never in the source checkout.
[[setup]]
command = "npm ci"

[verify]
full = "npm test"
typecheck = "npm run typecheck"

# Declared focused verification scopes (phase 4; invoked only via the
# authenticated /api/verify scheduler at unchanged budgets/thresholds —
# plain vitest invocations, no worker/timeout flags, never the npm chain).
residency-runtime = "npx vitest run test/resident-budget.test.ts test/runtime-resident-registry.test.ts test/fix-directive.test.ts test/silas-deterministic-seam.test.ts"
handoff-wave = "npx vitest run test/perkins-builtin-wave.test.ts test/perkins-whole-review.test.ts test/config.test.ts"
# T4 moved-ref/abort oracle only (phase pr144-t4-causal-repair-20261001):
# scheduled-observation discriminator — T4's duration in isolation vs FULL
# splits load-amplified structural cost from a new-head path regression.
t4-oracle = 'npx vitest run test/perkins-builtin-wave.test.ts -t "does not record a reconciled delivery"'
compaction-rollback = "npx vitest run test/pi-adapter.test.ts test/supervisor.test.ts test/config.test.ts test/health.test.ts test/board-engine.test.ts test/suite-shape.test.ts"
uploads-boot = "npx vitest run test/uploads-dir.test.ts"
# Narrow review-rebrief-interlock scope (phase pr144-independent-feedback-20261002):
# the RPC patch prerequisite, then the fence's own suites — unchanged
# configs/budgets, plain vitest; scheduled only via /api/verify by ops
# after the source settles (never executed directly by the lane writer).
review-rebrief-interlock = "node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/branch-idle-guard.test.ts test/silas-driver.test.ts test/suite-shape.test.ts"
native-compaction-wait = "node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/supervisor.test.ts test/suite-shape.test.ts"

# Baseline comparison for the lane: identical final test files (git show
# from the pinned head) run against an isolated baseline snapshot (git
# archive of the pinned base) using the unchanged baseline Vitest
# config/budgets and the existing node_modules bound by symlink — no
# worktree/branch mutation, no dependency install, both sides keep the
# approved RPC-patch prerequisite. Expected result is RED: the new-policy
# oracles encode wait-not-restart behavior the baseline lacks. The vitest
# exit status is left intact so the scheduler captures outcome.exitCode
# as evidence; it is never masked into a PASS. This scope never deletes
# snapshot material; the ignored pointer file
# _bmad-output/gate-prep/native-compaction-wait-baseline.last-snapshot.txt
# records the latest snapshot location, preserved for inspection.
native-compaction-wait-baseline = 'set -e; base=2aa836abe262759c651683deb40d05f02c9ede86; headrev=ab11bb327c4ba1ab3e3e3a9cc9e6b3bcaf4a22b3; root="$PWD"; prep=_bmad-output/gate-prep; mkdir -p "$prep"; d=$(mktemp -d "${TMPDIR:-/tmp}/gru-baseline-native-compaction-wait.XXXXXX"); git archive "$base" | tar -x -C "$d"; git show "$headrev":test/supervisor.test.ts > "$d/test/supervisor.test.ts"; git show "$headrev":test/suite-shape.test.ts > "$d/test/suite-shape.test.ts"; ln -s "$root/node_modules" "$d/node_modules"; printf "%s base=%s head=%s\n" "$d" "$base" "$headrev" > "$prep/native-compaction-wait-baseline.last-snapshot.txt"; cd "$d"; node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/supervisor.test.ts test/suite-shape.test.ts'

# Baseline fail-before proof for the review-rebrief-interlock digest fence
# (phase pr144-baseline-proof-readiness-20261002): the WHOLE identical final
# 35-test test/silas-driver.test.ts (git show from the pinned final-test
# head) runs against an isolated pre-fix baseline snapshot (git archive of
# the pinned base) using the unchanged baseline config/budgets and the
# existing root node_modules bound by symlink — no worktree/branch mutation,
# no dependency install, only the EXISTING installed Vitest CLI (npx
# resolves the symlinked local install; never a download) behind the
# original RPC-patch prerequisite. The vitest exit status is left intact so
# the scheduler captures outcome.exitCode as evidence; it is never masked
# into a PASS. Expected result is RED by ASSERTION: the pre-fix digest
# offers marker-fenced targets, so the two new fence cases fail while the
# 33 unchanged cases pass — not a collection/module RED (the final file
# imports only pre-existing APIs, including LedgerApi.listPendingRebriefs,
# which already exists at the base). No product branch-idle/silas-driver/
# helper code is replaced at the baseline, and no baseline suite-shape is
# copied: the base's own unchanged count pins differ intentionally and
# would only produce mechanical RED, not proof. This scope never deletes
# snapshot material; the ignored pointer file
# _bmad-output/gate-prep/review-rebrief-interlock-baseline.last-snapshot.txt
# records the latest snapshot location, preserved for inspection.
review-rebrief-interlock-baseline = 'set -e; base=6a00f4e50e7ae970915a9a534c142c1f8a45b57d; headrev=28779fe060f6ba06bf6f6f2b57bd348b8047f2de; root="$PWD"; prep=_bmad-output/gate-prep; mkdir -p "$prep"; d=$(mktemp -d "${TMPDIR:-/tmp}/gru-baseline-review-rebrief-interlock.XXXXXX"); git archive "$base" | tar -x -C "$d"; git show "$headrev":test/silas-driver.test.ts > "$d/test/silas-driver.test.ts"; ln -s "$root/node_modules" "$d/node_modules"; printf "%s base=%s head=%s\n" "$d" "$base" "$headrev" > "$prep/review-rebrief-interlock-baseline.last-snapshot.txt"; cd "$d"; node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/silas-driver.test.ts'

