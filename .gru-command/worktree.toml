# BEGIN GRU COMMAND BMAD BOOTSTRAP
[[setup]]
# Fresh clones have no git-local BMAD source. Only onboarded repositories
# run the generated copier; a configured but invalid source still fails loud.
command = "if git config --local --get gru-command.bmad-source >/dev/null 2>&1; then node .gru-command/bmad-bootstrap.mjs; fi"
# END GRU COMMAND BMAD BOOTSTRAP

# The scheduler runs inside each fresh job lane, never in the source checkout.
[[setup]]
command = "npm ci"

[verify]
full = "npm test"
typecheck = "npm run typecheck"

# Declared focused verification scopes (phase 4; invoked only via the
# authenticated /api/verify scheduler at the project's documented budgets
# — process-heavy files route through vitest.heavy.config.ts (120s,
# min(2, pin) workers), fast files stay on the root config (30s), and no
# scope masks an exit code or bypasses the declared policy. The
# scope-composition guard in test/test-budgets.test.ts pins every scope
# segment that names a classified heavy file to the heavy config.
residency-runtime = "npx vitest run --config vitest.heavy.config.ts test/fix-directive.test.ts && npx vitest run test/resident-budget.test.ts test/runtime-resident-registry.test.ts test/silas-deterministic-seam.test.ts"
handoff-wave = "npx vitest run --config vitest.heavy.config.ts test/perkins-builtin-wave.test.ts test/perkins-whole-review.test.ts && npx vitest run test/config.test.ts"

# Review-input handoff lane (owner ruling j-969): private frozen evidence,
# exact-target CI receipts, audited canonical amendments. Invoked only via
# the authenticated /api/verify scheduler at unchanged budgets/thresholds —
# a plain vitest invocation with the approved RPC patch prerequisite.
review-inputs = "node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/review-evidence-intake.test.ts test/review-ci-evidence.test.ts test/job-amendments.test.ts test/review-inputs-handoff.test.ts test/review-inputs-wave.test.ts test/dispatch-review-inputs.test.ts test/verification-evidence.test.ts test/github-poll.test.ts test/ledger-api.test.ts test/ledger-db.test.ts"

# Review-input handoff lane regression + full-run failure isolation: the
# seam-adjacent suites, plus the exact files whose timing-sensitive tests
# went red in this lane's FULL runs (complete captures preserved), run
# together at one head to establish whether those failures are contention
# or reproducible. Heavy-classified files route through the heavy config.
review-inputs-regression = "node tools/patch-vitest-rpc-timeout.mjs && npx vitest run --config vitest.heavy.config.ts test/dispatch-server.test.ts test/attachments.test.ts test/claude-adapter.test.ts test/perkins-whole-review.test.ts test/perkins-builtin-wave.test.ts test/lan-phone-raw-client.test.ts && npx vitest run test/chat-server.test.ts test/decisions.test.ts test/suite-shape.test.ts"
# The web shard needs the approved j-463 RPC-patch prerequisite first (the
# scheduler runs plain vitest, never the npm chain whose pretest applies it):
# without it vitest 3.2.7's hardcoded 60s birpc timer can fail suite
# collection under co-tenant load — run ebfb85f9 on 8f5662b collected only
# 5/9 suites with `[vitest-worker]: Timeout calling "fetch"`. Same upstream
# fix every other vitest scope here carries; no test/timeout/budget changes.
working-flavor = "node tools/patch-vitest-rpc-timeout.mjs && cd web && npx vitest run src/lib/working-flavor.test.ts src/ui/chat-working-flavor.test.ts src/ui/chat-attachments.test.ts src/ui/chat-composer.test.ts src/ui/chat-console.test.ts src/ui/chat-gfm-invariant.test.ts src/ui/chat-scroll.test.ts src/ui/chat-service-band.test.ts src/ui/chat-tool-turn.test.ts"
compaction-rollback = "npx vitest run test/pi-adapter.test.ts test/supervisor.test.ts test/config.test.ts test/health.test.ts test/board-engine.test.ts test/suite-shape.test.ts"

# Crew-heist-labels scopes (r7 evidence round; invoked only via the
# authenticated /api/verify scheduler at unchanged budgets/thresholds —
# explicit installed CLIs, no worker/timeout flags, never the npm chain).
# `crew-heist-labels` composes the focused backend suite, the focused web
# board suite, the web typecheck/build and the crew-rail Playwright project
# (the complete mock project belongs to `crew-rail-captures`, not this scope).
# `crew-rail-captures` is the web-first half (focused web suite, typecheck,
# build, crew-rail captures, then the complete mock project) so a load-
# affected smoke run can never withhold the capture files.
# `crew-captures-fast` is the minimal capture producer (build + the
# one-test crew-rail project + the smoke project) sized for a short
# admission window on the saturated shared host; the full combined roster
# stays available for a quiet window.
crew-heist-labels = "node tools/patch-vitest-rpc-timeout.mjs && cd web && node ../node_modules/vitest/vitest.mjs run src/ui/board.test.ts src/lib/board-protocol.test.ts && node ../node_modules/typescript/bin/tsc --noEmit -p tsconfig.json && node node_modules/vite/bin/vite.js build && node ../node_modules/@playwright/test/cli.js test --project=crew-rail && cd .. && npx vitest run --config vitest.heavy.config.ts test/dispatch-server.test.ts test/dispatch-e2e.test.ts test/fix-directive.test.ts test/perkins-builtin-wave.test.ts && npx vitest run test/ledger-db.test.ts test/ledger-api.test.ts test/board-engine.test.ts test/rebrief-recovery.test.ts test/silas-driver.test.ts test/supervisor.test.ts test/lessons-injection.test.ts test/suite-shape.test.ts"
# Browser acceptance on the isolated mock fixture: rebuilds web, then runs
# the complete mock project plus the dedicated crew-rail capture project.
# Captures land under web/test-results/<project>-<title>/crew-captures/.
crew-rail-captures = "node tools/patch-vitest-rpc-timeout.mjs && cd web && node ../node_modules/vitest/vitest.mjs run src/ui/board.test.ts src/lib/board-protocol.test.ts && node ../node_modules/typescript/bin/tsc --noEmit -p tsconfig.json && node node_modules/vite/bin/vite.js build && node ../node_modules/@playwright/test/cli.js test --project=crew-rail && node ../node_modules/@playwright/test/cli.js test --project=mock"
crew-captures-fast = "node tools/patch-vitest-rpc-timeout.mjs && cd web && node node_modules/vite/bin/vite.js build && node ../node_modules/@playwright/test/cli.js test --project=crew-rail"


