# Fails-before comparison for the r4 fix round. Baseline A = the pre-fix
# lane head; baseline B = the parent of the blocked-settle fix 1073216.
# Both overlay the CURRENT committed test sources onto a git archive of the
# pinned pre-fix commits (node_modules bound by symlink, same RPC patch
# prerequisite) and are EXPECTED RED: the new regressions fail before the
# fixes. The vitest exit codes are echoed intact so the scheduler captures
# both as evidence — never masked into a PASS. Snapshot dirs are preserved.
provider-recovery-r4-baseline = 'root="$PWD"; dA=$(mktemp -d "${TMPDIR:-/tmp}/gru-baseline-provider-recovery-r4a.XXXXXX"); git archive 8a68970ac56ee05632ca9ab86f54edf6058a19fc | tar -x -C "$dA" || { echo "baseline-A archive failed"; exit 3; }; cp test/provider-recovery-sensor.test.ts test/provider-recovery-ledger.test.ts test/provider-recovery-metadata.test.ts test/provider-recovery-seam.test.ts "$dA/test/"; ln -s "$root/node_modules" "$dA/node_modules"; ( cd "$dA" && node tools/patch-vitest-rpc-timeout.mjs >/dev/null 2>&1; npx vitest run test/provider-recovery-sensor.test.ts test/provider-recovery-ledger.test.ts test/provider-recovery-metadata.test.ts test/provider-recovery-seam.test.ts ); a=$?; echo "baseline-A pre-fix 8a68970 + current tests exit=$a EXPECTED-NONZERO"; dB=$(mktemp -d "${TMPDIR:-/tmp}/gru-baseline-provider-recovery-blocker.XXXXXX"); git archive 7bbc25de0dc8aa088369cb32fed69e21c78df44b | tar -x -C "$dB" || { echo "baseline-B archive failed"; exit 3; }; cp test/provider-recovery-sensor.test.ts test/provider-recovery-resume.test.ts test/provider-recovery-seam.test.ts "$dB/test/"; ln -s "$root/node_modules" "$dB/node_modules"; ( cd "$dB" && node tools/patch-vitest-rpc-timeout.mjs >/dev/null 2>&1; npx vitest run test/provider-recovery-sensor.test.ts test/provider-recovery-resume.test.ts test/provider-recovery-seam.test.ts ); b=$?; echo "baseline-B pre-fix 7bbc25d + blocker tests exit=$b EXPECTED-NONZERO"; echo "baseline snapshots preserved: A=$dA B=$dB"; if [ "$a" -eq 0 ] || [ "$b" -eq 0 ]; then echo "FAILS-BEFORE CLAIM BROKEN: a baseline passed unexpectedly"; fi; exit 1'

# Baseline comparison for the lane: identical final test files (git show
# from the pinned head) run against an isolated baseline snapshot (git
# archive of the pinned base) using the unchanged baseline Vitest
# config/budgets and the existing node_modules bound by symlink — no
# worktree/branch mutation, no dependency install, both sides keep the
# approved RPC-patch prerequisite. Expected result is RED: the new-policy
# oracles encode wait-not-restart behavior the baseline lacks. The vitest
# exit status is left intact so the scheduler captures outcome.exitCode
# as evidence; it is never masked into a PASS. This scope never deletes
# snapshot material; the ignored pointer file
# _bmad-output/gate-prep/native-compaction-wait-baseline.last-snapshot.txt
# records the latest snapshot location, preserved for inspection.
native-compaction-wait-baseline = 'set -e; base=2aa836abe262759c651683deb40d05f02c9ede86; headrev=ab11bb327c4ba1ab3e3e3a9cc9e6b3bcaf4a22b3; root="$PWD"; prep=_bmad-output/gate-prep; mkdir -p "$prep"; d=$(mktemp -d "${TMPDIR:-/tmp}/gru-baseline-native-compaction-wait.XXXXXX"); git archive "$base" | tar -x -C "$d"; git show "$headrev":test/supervisor.test.ts > "$d/test/supervisor.test.ts"; git show "$headrev":test/suite-shape.test.ts > "$d/test/suite-shape.test.ts"; ln -s "$root/node_modules" "$d/node_modules"; printf "%s base=%s head=%s\n" "$d" "$base" "$headrev" > "$prep/native-compaction-wait-baseline.last-snapshot.txt"; cd "$d"; node tools/patch-vitest-rpc-timeout.mjs && npx vitest run test/supervisor.test.ts test/suite-shape.test.ts'
# wizard-bmad-retry builds first so its CLI/pty legs execute the reviewed
# source's dist, then applies the repo-approved vitest RPC pretest patch
