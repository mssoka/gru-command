name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Release tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The board's deploy chip and `gru-service version` read
      # package.json; a tag that disagrees makes every update message lie.
      - name: Verify the tag names the packaged version
        run: node tools/verify-release-version.mjs "$GITHUB_REF_NAME"
