name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Full suite (Node 22)
    runs-on: ubuntu-latest
    steps:
      # PRs test GitHub's merge result against the current base branch.
      # Full history too, never a single-commit fetch: the App contract
      # baseline scope (#190) archives the immutable pre-repair integration
      # fe6a774, and the checkout's object store is what its shared clone
      # reads. A shallow fetch leaves that commit absent and the scope fails
      # on "fatal: not a tree object" instead of on the exercised contract.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # BMAD onboarding exercises the real uv bootstrap; PTY suites exercise
      # expect(1). Install on the disposable runner, not on user machines.
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.22'

      - name: Install PTY test prerequisite
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install dependencies
        run: npm ci

      - name: Provision locked property test fixture (isolated, no lifecycle scripts)
        run: node tools/provision-property-real-fixture.mjs materialize

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # This repo's `npm test` re-runs lint/typecheck/build as its own
      # definition of green, then the backend + web suites. Keeping the
      # stages above as separate steps makes a failure legible at a glance;
      # this step is the authoritative backend/web gate. The browser e2e
      # below gates every Playwright project.
      - name: Full test suite
        run: npm test

      - name: Build paired browser shell
        run: npm run build:web

      - name: Install browser e2e prerequisite
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Every Playwright project gates CI, not just intake (#402): board
      # geometry/hit-target, notification, strip and real-service specs
      # regressed on main unnoticed while only intake ran here. Screenshot
      # baselines are recorded on darwin only, so this Linux runner skips
      # the pixel comparisons; every behavioral assertion still runs.
      - name: Browser e2e (all projects)
        working-directory: web
        run: npx playwright test --ignore-snapshots

      # A Linux-only e2e failure is debuggable from its traces/screenshots.
      - name: Upload browser e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results*/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
