name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Full suite (Node 22)
    runs-on: ubuntu-latest
    steps:
      # Test the exact PR head under review, not GitHub's synthetic merge ref.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # BMAD onboarding exercises the real uv bootstrap; PTY suites exercise
      # expect(1). Install on the disposable runner, not on user machines.
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.22'

      - name: Install PTY test prerequisite
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # This repo's `npm test` re-runs lint/typecheck/build as its own
      # definition of green, then the backend + web suites. Keeping the
      # stages above as separate steps makes a failure legible at a glance;
      # this last step is the authoritative full gate.
      - name: Full test suite
        run: npm test
