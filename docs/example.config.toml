# Example configuration for Gru Command.
# Copy to ~/.gru-command/config.toml and edit.
# Every value below is generic — replace with your own.

workspace_root = "~/code"          # where your managed repos live (e.g. repos named alpha, beta)
data_dir = "~/.gru-command"        # per-instance state; never inside workspace_root

[server]
host = "127.0.0.1"                 # bind your LAN address to pair a phone; LAN only (no TLS in v1)
port = 7665

[auth]
token = "replace-with-a-random-string"   # required for the /ws chat socket (empty = chat rejects all)

[runtimes]
default = "pi"                     # "pi" | "claude-code"

[runtimes.roles]                   # optional per-role overrides
gru = "pi"
silas = "pi"
minion = "claude-code"
perkins = "pi"
bob = "pi"

[models]
# "default" = the runtime harness's own configured model (SPEC ruling 16:
# the product never hardcodes a model). Explicit: "provider/model".
default = "default"

[models.roles]                     # optional per-role overrides
gru = "provider/model-b"

[thinking]                         # thinking level policy, same shape as [models]
default = "default"                # or a level the runtime accepts

[thinking.roles]
perkins = "max"

[runtimes.pi]                      # per-runtime model & thinking policy
model = "default"
thinking_level = "default"

[runtimes.pi.roles]                # per-runtime per-role (model and/or thinking_level)
minion = { model = "provider/model-c", thinking_level = "low" }
bob = { thinking_level = "medium" }
