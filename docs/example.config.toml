# Copy-only example for Gru Command.
# The application reads ~/.gru-command/config.toml (or $GRU_COMMAND_HOME/config.toml),
# never this docs file. Prefer `npm run config:generate` for a live teaching config.

workspace_root = "~/code"          # selected managed repositories only
data_dir = "~/.gru-command"        # instance state; never inside workspace_root

[server]
host = "127.0.0.1"                 # trusted LAN only; v1 has no TLS
port = 7665                         # 0 = ephemeral

[auth]
token = "replace-with-a-random-string" # generated uniquely by the wizard/generator

[runtimes]
default = "pi"                     # "pi" | "claude-code"

[runtimes.roles]
# Optional; omitted roles inherit runtimes.default.
# gru = "pi"
# silas = "pi"
# minion = "pi"
# perkins = "pi"
# bob = "pi"

[models]
default = "default"                # runtime's configured model; never hardcoded here

[models.roles]
# Optional; uncommenting "default" deliberately pins the runtime default.
# gru = "default"
# silas = "default"
# minion = "default"
# perkins = "default"
# bob = "default"

[thinking]
default = "default"                # runtime's configured thinking level

[thinking.roles]
# gru = "default"
# silas = "default"
# minion = "default"
# perkins = "default"
# bob = "default"

[runtimes.pi]
# model = "default"                # optional runtime-wide overrides
# thinking_level = "default"
# model_refresh = true             # ONE bounded network catalog refresh on unknown model
# model_refresh_timeout_ms = 10000 # refresh deadline (ms); model_refresh = false = offline

[runtimes.pi.roles]
# gru = { model = "default", thinking_level = "default" }
# silas = { model = "default", thinking_level = "default" }
# minion = { model = "default", thinking_level = "default" }
# perkins = { model = "default", thinking_level = "default" }
# bob = { model = "default", thinking_level = "default" }

[runtimes.claude-code]
# model = "default"
# thinking_level = "default"

[runtimes.claude-code.roles]
# gru = { model = "default", thinking_level = "default" }
# silas = { model = "default", thinking_level = "default" }
# minion = { model = "default", thinking_level = "default" }
# perkins = { model = "default", thinking_level = "default" }
# bob = { model = "default", thinking_level = "default" }

[supervision]
enabled = true
turn_silence_ms = 900000
restart_window_ms = 600000
max_restarts = 3
restart_backoff_ms = 2000

[logging]
max_bytes = 10485760
keep = 5

[chat]
frame_log_max_bytes = 8388608
frame_log_keep = 3
# Wake policy for Gru awareness: "action-required" (default; machine
# attention OPENS a Gru turn), "all", or "never" (passive context only).
notify_wake = "action-required"
# Minimum interval between autonomous wakes (ms); 0 disables the cap.
wake_min_interval_ms = 300000
# Severity floor for a wake: "info" or "error".
wake_min_severity = "info"
# Local-time quiet window ("HH:MM-HH:MM", may wrap midnight); "" = off.
wake_quiet_hours = ""
# First block after this quiet gap carries the "while you were away" digest.
morning_digest_gap_ms = 28800000

[worktrees]
# root = "~/.gru-command/worktrees" # omitted so it follows data_dir
# preserve_root = "~/.gru-command/worktree-preserves"
setup_timeout_ms = 120000

[dispatch]                        # dispatch flow (E8) — all optional
bob_interval_ms = 3600000         # Bob's consolidation interval; 0 disables

[lessons]                         # Book of Lessons — all optional, live by default
# Deliberate journal entries (Gru/Silas via /api/journal, minion lessons blocks)
# are distilled by Bob's dream pass into a capped, deduped bible; briefings
# carry pointer lines only (chapter bodies are read on demand, never inlined).
enabled = true                    # false disables the dream cadence and pointer injection
                                  # (the journal API stays available — capture is never lost)
dream_interval_ms = 43200000      # 12h; on boot plus every interval, 0 = no periodic pass
dream_on_boot = true              # one catch-up pass when the service boots
chapter_cap_bytes = 4096          # hard cap per chapter; the dream trims to fit
index_cap_bytes = 1024           # hard cap for INDEX.md — the only part ever embedded
max_references = 3                # pointer lines injected into one briefing/directive max

[silas]                           # hosted ops session — all optional, live by default
# Silas closes the delivered→PR→review loop without a human ping and breaks
# recurring blocker loops (directive → re-brief fresh minion → escalate).
# No review-round cap: while blockers evolve, the loop continues.
enabled = true                    # false hosts no silas slot and fires no wakes
sweep_interval_ms = 300000        # periodic ops sweep; 0 disables (event wakes stay live)
poll_interval_ms = 60000          # GitHub signal poll (POLL-ONLY): merged PRs, conflicts, CI
                                  # conclusions via authenticated `gh api`; 0 disables
stall_threshold_ms = 1800000      # working lane with a silent minion for this long is stalled
directive_at = 2                  # consecutive same-blocker rounds before a fix directive
rebrief_at = 3                    # …before a re-brief to a fresh minion on the lane
escalate_at = 4                   # …before escalation to the chief (always beats an endless loop)

[review]
# Review gate policy (user amendment 2026-09-20). Optional; enabled by default.
# enabled: false routes every review request to the bmad-review fallback gate
# (when installed; otherwise escalate-only). true keeps Perkins as the primary
# gate behind the four-leg capability pre-flight.
enabled = true

[verify]                          # verification scheduler (contention fix) — all optional
# Lanes request their project's verify command via POST /api/verify
# {job_id, scope}; the scheduler owns ONE global test budget across lanes.
# Declared commands live in the repo at .gru-command/worktree.toml ([verify]).
max_concurrent = 1                # concurrent runs; further requests queue FIFO
worker_budget = 0                 # total test workers across runs; 0 = auto (cores - 2)
lock_wait_timeout_ms = 900000     # queued request past this fails loud (never a silent hang)
run_timeout_ms = 1800000          # per-run wall clock; expiry kills the process group
