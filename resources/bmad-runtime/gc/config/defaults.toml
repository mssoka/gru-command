# Gru Command BMAD runtime defaults (gru-command-bmad).
#
# The lowest configuration layer for every managed repository. These are the
# values the upstream bmad-method installer writes for a default install,
# limited to the settings the bundled skills read. A project overrides them
# in its own _bmad/custom/config.toml (team, committed) or
# _bmad/custom/config.user.toml (personal, never committed); see
# docs/BMAD-RUNTIME.md for the full precedence.

[core]
communication_language = "English"
document_output_language = "English"
output_folder = "{project-root}/_bmad-output"

[modules.bmm]
planning_artifacts = "{project-root}/_bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/_bmad-output/implementation-artifacts"
project_knowledge = "{project-root}/docs"
